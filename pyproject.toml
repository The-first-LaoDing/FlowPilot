[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot"
version = "0.1.0"
description = "FlowPilot: a dual-stream Flow Matching world model for autonomous drone navigation, with a Flightmare/RViz simulation runtime."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24",
    "einops>=0.7",
    "opencv-python>=4.8",
    "ruamel.yaml>=0.17",
]

[tool.setuptools.packages.find]
include = ["flowpilot*"]
